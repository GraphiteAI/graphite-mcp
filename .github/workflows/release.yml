name: Publish to PyPI

# Builds the wheel + sdist on every `v*` tag push and uploads to PyPI via
# Trusted Publishing — no API token stored anywhere. PyPI verifies the
# upload came from THIS repo + workflow via OIDC.
#
# Release flow once configured:
#   1. Bump `version` in pyproject.toml
#   2. git commit -am "v0.1.1" && git push
#   3. git tag v0.1.1 && git push --tags
#   → this workflow runs, builds, publishes. `pip install graphite-mcp`
#     picks up the new version within ~60s.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: read
  id-token: write       # required for PyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish:
    name: Build + publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graphite-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF##*/v}"
          PROJ_VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VERSION" != "$PROJ_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pyproject version $PROJ_VERSION" >&2
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:` — Trusted Publisher handles auth via OIDC.
